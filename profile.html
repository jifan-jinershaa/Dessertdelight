<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        My Profile | Dessert Delight
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            DESSERT DELIGHT
        </a>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="desserts.html">
                Desserts
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="order.html">
                Orders
            </a>

        </nav>

    </header>


    <main
        style="
            max-width:900px;
            margin:70px auto;
            padding:0 25px;
        "
    >

        <h1
            style="
                font-family:'Playfair Display',serif;
                color:#4A2C20;
                font-size:42px;
                margin-bottom:10px;
            "
        >
            My Profile
        </h1>


        <p
            style="
                color:#765548;
                margin-bottom:35px;
            "
        >
            Manage your Dessert Delight account.
        </p>


        <section
            style="
                background:#FFFFFF;
                padding:35px;
                border:1px solid #E4D7C8;
                box-shadow:0 12px 35px rgba(74,44,32,.08);
            "
        >

            <div
                style="
                    display:flex;
                    align-items:center;
                    gap:20px;
                    margin-bottom:30px;
                "
            >

                <div
                    id="profileAvatar"
                    style="
                        width:70px;
                        height:70px;
                        border-radius:50%;
                        background:#F3D9DC;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:#4A2C20;
                        font-weight:700;
                        font-size:20px;
                    "
                >
                </div>


                <div>

                    <h2
                        id="profileName"
                        style="
                            font-family:'Playfair Display',serif;
                            color:#4A2C20;
                            margin-bottom:5px;
                        "
                    >
                    </h2>


                    <p
                        id="profileEmail"
                        style="
                            color:#765548;
                        "
                    >
                    </p>

                </div>

            </div>


            <hr
                style="
                    border:none;
                    border-top:1px solid #E4D7C8;
                    margin-bottom:25px;
                "
            >


            <h3
                style="
                    font-family:'Playfair Display',serif;
                    color:#4A2C20;
                    margin-bottom:15px;
                "
            >
                Account
            </h3>


            <p
                style="
                    color:#765548;
                    line-height:1.7;
                "
            >
                Your Dessert Delight account is active.
                You can browse desserts, manage your cart,
                place orders and track your dessert journey.
            </p>


            <button
                onclick="logoutDessertDelight()"
                style="
                    margin-top:25px;
                    background:#4A2C20;
                    color:#FFFFFF;
                    border:none;
                    padding:13px 24px;
                    cursor:pointer;
                    font-weight:600;
                "
            >
                Log Out
            </button>

        </section>

    </main>

<script src="js/auth.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        const user = window.dessertDelightAuth.getUser();

        if (!user) {
            return;
        }

        document.getElementById('profileName').textContent =
            user.name;

        document.getElementById('profileEmail').textContent =
            user.email;

        const initials = user.name
            .trim()
            .split(/\s+/)
            .map(word => word[0])
            .join('')
            .substring(0, 2)
            .toUpperCase();

        document.getElementById('profileAvatar').textContent =
            initials;
    });
</script>

</body>
</html>
